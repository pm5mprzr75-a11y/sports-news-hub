# Render 部署配置（免费版即可）：公开 URL、手机免登录、关电脑也在。
# 部署方式（任选其一）：
#   A. 在 GitHub 仓库 README 点 "Deploy to Render" 按钮（需 GitHub OAuth，EMU 账号可能被拦）；
#   B. 在 Render 控制台手动 New Web Service -> 关联本仓库，Start Command 填下面 startCommand；
#   C. 提供 Render API Key，由助手用 API 直接建服务（绕开 GitHub OAuth）。
services:
  - type: web
    name: sports-news-hub
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
