name: Daily Sports Crawl

on:
  schedule:
    # 每天北京时间 03:00 抓取（UTC+8 → 19:00 UTC 前一天）
    - cron: "0 19 * * *"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawl (last 7 days)
        run: python scheduler/run_crawl.py --days 7

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sports_news.db
          if git commit -m "chore: daily crawl $(date -u +'%Y-%m-%dT%H:%M:%SZ')"; then
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "no changes to commit"
          fi
