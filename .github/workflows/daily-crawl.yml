name: Daily Sports Crawl + Build Site

# 每日北京时间 03:00 抓取最新体育资讯，并重新生成静态站点数据（docs/data.json）
# 推回 main 后，GitHub Pages（Deploy from a branch: main /docs）会自动重新部署。
# 注意：刻意不监听 push，避免「commit → push → 再触发」死循环。
on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:       # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (精简，仅抓取 + 构建所需)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Run crawl (last 7 days)
        run: python scheduler/run_crawl.py --days 7

      - name: Build static site data
        run: python build_site.py

      - name: Commit database + site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sports_news.db docs/data.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: daily crawl + site data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
