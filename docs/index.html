<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体育情报站 · 体育产业新闻聚合</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="brand">
      <div class="logo">🏟️</div>
      <div>
        <h1>体育情报站</h1>
        <div class="sub">SPORTS INTEL · 产业 · 赛事 · 评论</div>
      </div>
    </div>
    <div class="hero-meta" id="hero-meta"></div>
  </div>
</div>

<div class="wrap">
  <div id="loading">正在加载最新体育资讯… ⚡</div>

  <div id="app">
    <!-- 统计卡片 -->
    <div id="stat-row"></div>

    <!-- 标签页 -->
    <div id="tabs">
      <div class="tab active" data-tab="all">📰 全部</div>
      <div class="tab" data-tab="bookmarks">⭐ 收藏 <span id="bm-count"></span></div>
      <div class="tab" data-tab="history">🕘 历史</div>
      <div class="tab" data-tab="subs">💌 订阅</div>
      <div class="tab" data-tab="monitor">📡 监控</div>
    </div>

    <!-- 筛选 -->
    <div class="panel">
      <h2><span class="bar"></span>筛选与搜索</h2>
      <div class="filter-row">
        <span class="filter-label">关键词</span>
        <div class="search-box">
          <input id="search" type="text" placeholder="搜索标题 / 正文 / 球队 / 关键词…">
        </div>
        <select id="sort">
          <option value="new">最新</option>
          <option value="comments">评论最多</option>
          <option value="score">最热议</option>
        </select>
        <select id="range">
          <option value="7">近7天</option>
          <option value="30" selected>近30天</option>
          <option value="90">近90天</option>
          <option value="0">全部</option>
        </select>
      </div>

      <div class="filter-group" id="filter-sport"></div>
      <div class="filter-group" id="filter-category"></div>
      <div class="filter-group" id="filter-source"></div>
      <div class="filter-group" id="filter-sentiment">
        <span class="filter-label">情感</span>
        <span class="toggle sent pos active" data-sent="all">全部</span>
        <span class="toggle sent pos" data-sent="pos">😊 正面</span>
        <span class="toggle sent neg" data-sent="neg">😟 负面</span>
        <span class="toggle sent neu" data-sent="neu">😐 中性</span>
      </div>

      <div class="filter-row" style="margin-top:10px;">
        <span class="filter-label">自定义关键词</span>
        <div class="kw-input">
          <input id="kw-input" type="text" placeholder="加自定义项目/关键词，如：欧冠、梅西、NBA…">
          <button class="btn sm green" id="kw-add">＋ 添加</button>
        </div>
      </div>
      <div class="filter-group" id="kw-list"></div>

      <!-- 订阅面板 -->
      <div id="tab-subs" style="display:none; margin-top:12px; border-top:1px dashed var(--line); padding-top:12px;">
        <div class="filter-label" style="margin-bottom:6px;">订阅运动 / 项目</div>
        <div class="filter-group" id="sub-sport"></div>
        <div class="filter-label" style="margin:8px 0 6px;">订阅球队 / 球员（回车添加）</div>
        <div class="kw-input"><input id="sub-entity" type="text" placeholder="输入球队或球员名…"></div>
        <div class="filter-group" id="sub-entity-list" style="margin-top:6px;"></div>
      </div>

      <!-- 监控面板 -->
      <div id="tab-monitor" style="display:none; margin-top:12px; border-top:1px dashed var(--line); padding-top:12px;">
        <div class="filter-label" style="margin-bottom:6px;">关键词监控（有新相关新闻会显示数量）</div>
        <div class="kw-input"><input id="mon-input" type="text" placeholder="输入监控词，回车添加…"></div>
        <div class="filter-group" id="mon-list" style="margin-top:6px;"></div>
      </div>
    </div>

    <!-- 可视化 -->
    <div class="panel">
      <h2><span class="bar"></span>数据看板</h2>
      <div class="viz-grid">
        <div class="viz-box"><h3>📡 来源占比</h3><div id="viz-source"></div></div>
        <div class="viz-box"><h3>😊 情感分布</h3><div id="viz-sentiment"></div></div>
        <div class="viz-box"><h3>🏆 各运动发布量</h3><div id="viz-stacked"></div></div>
        <div class="viz-box"><h3>📈 近7天热度</h3><div id="viz-line"></div></div>
        <div class="viz-box" style="grid-column:1/-1;"><h3>🔥 关键词词云</h3><div id="viz-cloud"></div></div>
      </div>
    </div>

    <!-- 爬虫状态 -->
    <div class="panel">
      <h2><span class="bar"></span>爬虫状态</h2>
      <div id="crawl-stats"></div>
      <div id="crawl-runs"></div>
    </div>

    <!-- 操作条 -->
    <div class="panel" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div style="font-weight:800; font-size:14px;">📰 资讯列表</div>
      <button class="btn green" id="btn-export">📝 导出 Markdown</button>
    </div>

    <div id="cards"></div>
    <div id="empty-tip" style="display:none;"></div>
  </div>

  <div class="footer">体育情报站 · 数据每日自动抓取更新 · GitHub Pages 托管</div>
</div>

<!-- 文章详情弹窗（正文 + 评论） -->
<div class="modal-mask" id="detail-mask">
  <div class="modal">
    <div class="modal-head"><h3 id="detail-title">详情</h3><span class="x" onclick="closeDetail()">×</span></div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<!-- 导出弹窗 -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">导出</h3><span class="x" id="modal-close">×</span></div>
    <div class="modal-tools">
      <button class="btn sm" id="modal-copy">📋 复制</button>
      <button class="btn sm ghost" id="modal-download">⬇ 下载</button>
    </div>
    <div class="modal-body"><textarea id="modal-text" readonly></textarea></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
